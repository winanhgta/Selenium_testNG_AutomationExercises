name: Automation Exercise CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  # Thêm phần lập lịch chạy tự động dưới đây
#  schedule:
#    # 23:00 UTC là 06:00 sáng VN
#    # 05:00 UTC là 12:00 trưa VN
#    # 12:00 UTC là 19:00 tối VN
#    - cron: '0 23,5,12 * * *'
#  # Cho phép kích hoạt chạy thử thủ công bằng nút bấm trên giao diện GitHub
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử commit để có thể đọc được tên commit

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

          # Bước này để đảm bảo thư mục history tồn tại, tránh lỗi Unknown khi chạy lần đầu

      - name: Run Tests with Maven
      # Thêm -Dallure.results.directory để ép Maven ghi đúng chỗ
        run: |
            mkdir -p target/allure-results
            mvn clean test -Dheadless=true -Dmaven.test.failure.ignore=true -Dallure.results.directory=target/allure-results

      - name: Debug Allure Results
        if: always()
        run: |
          echo "Check if target exists:"
          ls -d target || echo "Target folder NOT found"
          echo "Check if allure-results exists:"
          ls -d target/allure-results || echo "allure-results folder NOT found"
          echo "List files in allure-results:"
          ls target/allure-results || echo "No files in allure-results"

      - name: List Allure Results (Debug)
        if: always()
        run: |
                echo "Kiểm tra thư mục target:"
                ls -d target/allure-results || echo "Không thấy thư mục!"
                ls target/allure-results || echo "Thư mục trống không có file json nào!"

      - name: Allure Report Action
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
                allure_results: target/allure-results
                allure_history: allure-history
                keep_reports: 20
                single_file: false # Đảm bảo không nén thành 1 file duy nhất

      - name: Deploy Allure Report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: allure-history # Đẩy toàn bộ nội dung trong folder này lên
            # Thêm dòng này để GitHub Pages không chặn các file của Allure
            keep_files: true

      - name: Set Time and Commit Message
        if: always()
        run: |
          # Lấy thời gian hiện tại theo múi giờ Việt Nam (UTC+7)
          echo "REPORT_TIME=$(date -d "+7 hours" "+%d/%m/%Y %H:%M:%S")" >> $GITHUB_ENV

          # 2. Lấy nội dung commit cuối cùng bằng lệnh Git (An toàn nhất)
          # %s là lấy dòng tiêu đề, %b là lấy phần thân. Ở đây mình lấy tiêu đề.
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
    
          # 3. Loại bỏ ký tự lạ và lưu vào môi trường
          echo "COMMIT_NAME=$COMMIT_MSG" >> $GITHUB_ENV

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        if: always()
        with:
          to: ${{ secrets.Telegram_To }}
          token: ${{ secrets.Telegram_Token }}
          format: html
          message: |
            <b>🚀 Test result run on GitHub</b>
            <b>Project:</b> ${{ github.repository }}
            <b>Commit:</b> <code>${{ env.COMMIT_NAME }}</code>
            <b>Time:</b> ${{ env.REPORT_TIME }}
            <b>Status:</b> ${{ job.status == 'success' && '✅ Success' || '❌ Fail' }}
            <b>Report Link:</b> https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}